services:
  vpn:
    image: pod-automator:latest
    container_name: vpn-{{pod_id}}
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices: [/dev/net/tun]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    entrypoint: ["/bin/sh", "/vpn-entrypoint.sh"]
    command: ["{{vpn_host}}", "{{vpn_user}}", "{{vpn_pass}}"]
    restart: unless-stopped
    healthcheck:
      # Health means "the tunnel is connected", nothing more.
      #
      # This probed vManage, so a freshly loaded POD showed its VPN red for as
      # long as vManage was down — which on a new POD is until the router has
      # been base-configured, since vManage sits behind it. POD-3 on 2026-09-02
      # read red with the tunnel plainly working: "CSTP connected ... Configured
      # as 10.16.28.113", 198.18.0.0/15 routed over tun0, jump host answering on
      # RDP. The dot was reporting "is every device up", which is not what it
      # says and not what the operator needs from it.
      #
      # The jump host is the right target: it boots early, is present in every
      # pod, sits on the same segment the tunnel routes, and answers on RDP
      # before anything else is configured. Reaching it proves the tunnel
      # carries traffic into the pod, which is the whole claim.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('198.18.133.36', 3389), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  pipeline:
    image: pod-automator:latest
    container_name: pipeline-{{pod_id}}
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      POD_ID: {{pod_id}}
      SERIAL: {{serial}}
      VMANAGE: {{vmanage_ip}}
      VMANAGE_USER: {{vmanage_user}}
      VMANAGE_PASS: {{vmanage_pass}}
      ROUTER_IP: {{router_ip}}
      ROUTER_USER: {{router_user}}
      ROUTER_PASS: {{router_pass}}
      DB_PATH: /pipeline/host-data/pod_state.db
      SCC_KEYS_DIR: /pipeline/host-data/scc_keys
      BOOTSTRAP_PATH: /pipeline/data/bootstrap/ciscosdwan.cfg
    volumes:
      - {{pod_id}}-bootstrap:/pipeline/data/bootstrap
      - {{host_data}}:/pipeline/host-data
    restart: "no"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: "172.{{pod_subnet}}.0.0/16"

volumes:
  {{pod_id}}-bootstrap:
