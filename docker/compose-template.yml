services:
  vpn:
    image: pod-automator:latest
    container_name: vpn-{{pod_id}}
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices: [/dev/net/tun]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    entrypoint: ["/bin/sh", "/vpn-entrypoint.sh"]
    command: ["{{vpn_host}}", "{{vpn_user}}", "{{vpn_pass}}"]
    restart: unless-stopped
    healthcheck:
      # Health means "the tunnel carries traffic into the pod", NOT "every
      # device has finished booting". This probed vManage only, so a freshly
      # loaded POD reported the VPN red for as long as vManage was down —
      # POD-3 on 2026-09-02 showed red with the tunnel up, 198.18.0.0/15
      # routed and the jump host answering, because its router had not been
      # base-configured yet and vManage sits behind it.
      #
      # Pass if EITHER answers: vManage (the pod is fully up) or the jump
      # host on RDP (the tunnel works and the pod is reachable). The jump
      # host boots early and is always present, so it is the honest test of
      # the thing this healthcheck is named for.
      test: ["CMD", "python3", "-c", "import socket,sys\nfor a in (('{{vmanage_ip}}',443),('198.18.133.36',3389)):\n    try:\n        socket.create_connection(a, timeout=3).close(); sys.exit(0)\n    except Exception: pass\nsys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  pipeline:
    image: pod-automator:latest
    container_name: pipeline-{{pod_id}}
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      POD_ID: {{pod_id}}
      SERIAL: {{serial}}
      VMANAGE: {{vmanage_ip}}
      VMANAGE_USER: {{vmanage_user}}
      VMANAGE_PASS: {{vmanage_pass}}
      ROUTER_IP: {{router_ip}}
      ROUTER_USER: {{router_user}}
      ROUTER_PASS: {{router_pass}}
      DB_PATH: /pipeline/host-data/pod_state.db
      SCC_KEYS_DIR: /pipeline/host-data/scc_keys
      BOOTSTRAP_PATH: /pipeline/data/bootstrap/ciscosdwan.cfg
    volumes:
      - {{pod_id}}-bootstrap:/pipeline/data/bootstrap
      - {{host_data}}:/pipeline/host-data
    restart: "no"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: "172.{{pod_subnet}}.0.0/16"

volumes:
  {{pod_id}}-bootstrap:
